[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pylogstream"
version = "0.1.0"
description = "High-throughput parallel log generation and streaming analysis pipeline."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Muresan Razvan", email = "razvanmuresan1802@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pyright>=1.1.0",
    "ruff>=0.3.0",
]

[project.scripts]
pylogstream = "pylogstream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pylogstream"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]